name: Hosted database status

# On demand: prints how many records each collection holds in the hosted Supabase database and how many
# profiles exist by role and status. Counts only; no record contents and no email addresses are printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 hosting/supabase_setup.py inspect
