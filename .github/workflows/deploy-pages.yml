name: Deploy Analytics Hub to GitHub Pages

# Builds hosting/dist (the unchanged Hub page + Supabase adapter), publishes it with GitHub Pages, then opens the
# live page in a browser to confirm the sign-in screen renders and Supabase answers.
#
# Two ways to supply the Supabase project:
#   A. Repository secret SUPABASE_ACCESS_TOKEN (Supabase personal access token): the workflow finds or creates the
#      project, runs hosting/schema.sql, sets the password policy and redirect URLs, and reads the anon key itself.
#      Optional repository variables: SUPABASE_PROJECT_NAME, SUPABASE_ORG_SLUG, SUPABASE_REGION, CONFIRM_EMAIL.
#   B. Repository variables SUPABASE_URL and SUPABASE_ANON_KEY when the project was set up by hand.
# Pages must be enabled with source "GitHub Actions" (Settings > Pages). Deploys run from the default branch.

on:
  push:
    paths: ["app/**", "hosting/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
  SUPABASE_ORG_SLUG: ${{ vars.SUPABASE_ORG_SLUG }}
  SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
  CONFIRM_EMAIL: ${{ vars.CONFIRM_EMAIL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME }}
  SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expected page URL
        id: site
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"
      - name: Set up the Supabase project (schema, password policy, keys)
        id: sb
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: python3 hosting/supabase_setup.py setup --site-url "${{ steps.site.outputs.url }}"
      - name: Pre-flight summary
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Pre-flight run on ${GITHUB_REF_NAME} - Supabase setup and build only; the default branch deploys." >> "$GITHUB_STEP_SUMMARY"
      - name: Build hosting/dist
        env:
          SUPABASE_URL: ${{ steps.sb.outputs.url || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon_key || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          ACCOUNT_NAME: ${{ vars.ACCOUNT_NAME }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::No Supabase project: add the repository secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions > Secrets) or the variables SUPABASE_URL and SUPABASE_ANON_KEY, then re-run."
            exit 1
          fi
          python3 hosting/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hosting/dist

  deploy:
    # The github-pages environment only accepts deploys from the repository's default branch; a run on any other
    # branch stops after the build as a pre-flight of the Supabase setup.
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Supabase Site URL at the deployed page
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: python3 hosting/supabase_setup.py finalize --site-url "${{ needs.deploy.outputs.page_url }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Open the live page and check the sign-in screen
        run: node hosting/verify.js "${{ needs.deploy.outputs.page_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-screenshot
          path: verify.png
          if-no-files-found: ignore
