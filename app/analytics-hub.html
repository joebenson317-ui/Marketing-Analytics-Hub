<script>// ===== Analytics Hub (hosted) — engines =====
const $ = (s, el=document) => el.querySelector(s); const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);

// --- tabular: CSV parse (RFC-ish) + xlsx via SheetJS when present
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false; text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c; }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
async function readFile(file) {
  if (/\.xlsx?$/i.test(file.name) && window.XLSX) { const wb = XLSX.read(await file.arrayBuffer(), {type: "array"}); const ws = wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_csv(ws); }
  return await file.text();
}
const normH = h => String(h).trim().toLowerCase().replace(/\s+/g, " ");
async function sha256(text) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function headerHash(headers) { return sha256(headers.map(normH).filter(Boolean).sort().join("\x1f")); }

// --- recipe engine
function applyRecipe(grid, steps) {
  let header = null, rows = grid.map(r => [...r]);
  const need = () => { if (!header) throw new Error("promote_header must run first"); return header; };
  const col = n => { const h = need(); const i = h.indexOf(n); if (i < 0) throw new Error(`column ${n} not found`); return i; };
  for (const st of steps || []) {
    if (st.op === "skip_rows") rows = rows.slice(st.n);
    else if (st.op === "promote_header") { header = rows[0].map(c => String(c).trim()); rows = rows.slice(1); }
    else if (st.op === "drop_where") { const i = col(st.col); rows = rows.filter(r => String(r[i] ?? "").trim() !== String(st.equals)); }
    else if (st.op === "rename") header = need().map(h => st.map[h] || h);
    else if (st.op === "constant") { header = [...need(), st.col]; rows = rows.map(r => [...r, st.value]); }
    else if (st.op === "drop_empty") rows = rows.filter(r => r.some(c => String(c).trim()));
    else throw new Error("unknown op " + st.op);
  }
  if (!header) { header = rows[0].map(c => String(c).trim()); rows = rows.slice(1); }
  return {header, records: rows.map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ""])))};
}
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/[,$%\s]/g, "")); return isNaN(n) ? null : n; };
const isNum = v => num(v) !== null;
function parseDate(v, fmtS) { // supports %Y-%m-%d, %d/%m/%Y, %m/%d/%Y
  const s = String(v).trim(); const m = s.match(/^(\d{1,4})[-\/](\d{1,2})[-\/](\d{1,4})$/); if (!m) return null;
  let y, mo, d; if (fmtS === "%Y-%m-%d") [y, mo, d] = [m[1], m[2], m[3]]; else if (fmtS === "%d/%m/%Y") [d, mo, y] = [m[1], m[2], m[3]]; else [mo, d, y] = [m[1], m[2], m[3]];
  if (String(y).length !== 4) return null; const dt = new Date(Date.UTC(+y, +mo - 1, +d)); return isNaN(dt) ? null : dt.toISOString().slice(0, 10);
}

// --- rule engine
const STARTER_RULES = [
  {id:"req", name:"Required columns", kind:"required_columns", level:"error", params:{columns:["Date","Placement Name","Impressions"]}, source:"Agency policy"},
  {id:"neg", name:"No negatives", kind:"no_negatives", level:"error", params:{columns:["Impressions","Clicks","Media Cost"]}, source:"Agency policy"},
  {id:"clk", name:"Clicks ≤ impressions", kind:"lte", level:"error", params:{a:"Clicks", b:"Impressions"}, source:"Agency policy"},
  {id:"view", name:"Viewable ≤ impressions", kind:"lte", level:"error", params:{a:"Viewable Impressions", b:"Impressions"}, source:"Agency policy"},
  {id:"reach", name:"Reach ≤ impressions", kind:"lte", level:"error", params:{a:"Unique Reach", b:"Impressions"}, source:"Agency policy"},
  {id:"dup", name:"Duplicate rows (date + placement)", kind:"no_duplicates", level:"error", params:{keys:["Date","Placement Name"]}, source:"Agency policy"},
  {id:"ctr", name:"CTR reconciles with clicks ÷ impressions", kind:"rate_reconciles", level:"warning", params:{rate:"CTR", num:"Clicks", den:"Impressions", scale:100, tol:0.02}, source:"Agency policy"},
  {id:"tax", name:"Placement names pass the taxonomy", kind:"taxonomy", level:"warning", params:{col:"Placement Name"}, source:"Client taxonomy"},
];
function runRules(records, suite, ctx={}) {
  const out = []; const cols = new Set(records[0] ? Object.keys(records[0]) : []);
  const F = (rule, message, rows, fix) => ({rule: rule.id, name: rule.name, level: rule.level || "error", message, rows: rows.slice(0, 50), count: rows.length, fix: fix || rule.fix || "", source: rule.source || "Agency policy"});
  for (const rule of suite) { const p = rule.params || {}; let rows = [];
    if (rule.kind === "required_columns") { const miss = p.columns.filter(c => !cols.has(c)); if (miss.length) out.push(F(rule, "missing columns: " + miss.join(", "), [], "add or map these columns")); continue; }
    if (rule.kind === "no_negatives") records.forEach((r, i) => { if (p.columns.some(c => c in r && (num(r[c]) ?? 0) < 0)) rows.push(i); });
    else if (rule.kind === "lte") records.forEach((r, i) => { const a = num(r[p.a]), b = num(r[p.b]); if (a != null && b != null && a > b) rows.push(i); });
    else if (rule.kind === "rate_reconciles") records.forEach((r, i) => { const rt = num(r[p.rate]), n = num(r[p.num]), d = num(r[p.den]); if (rt == null || n == null || !d) return; if (Math.abs(rt - n / d * (p.scale || 1)) > (p.tol ?? 0.01)) rows.push(i); });
    else if (rule.kind === "no_duplicates") { const seen = new Set(); records.forEach((r, i) => { const k = p.keys.map(c => String(r[c])).join("|"); if (seen.has(k)) rows.push(i); seen.add(k); }); }
    else if (rule.kind === "taxonomy") { if (ctx.taxonomy) records.forEach((r, i) => { if (r[p.col] && !taxCheck(ctx.taxonomy, String(r[p.col])).ok) rows.push(i); }); }
    if (rows.length) out.push(F(rule, `${rule.name}: ${rows.length} row(s)`, rows));
  }
  return out;
}
const qaStatus = f => f.some(x => x.level === "error") ? "Fail" : f.length ? "Pass with warnings" : "Pass";

// --- taxonomy
const PH = "NA";
function taxCheck(spec, name) { const parts = name.split(spec.delimiter); const probs = [];
  if (parts.length !== spec.levels.length) probs.push(`expected ${spec.levels.length} positions, found ${parts.length}`);
  spec.levels.forEach((lv, i) => { const v = parts[i]; if (v == null) return;
    if (v === "" || (v === PH && lv.required !== false)) probs.push(`position ${i+1} (${lv.name}) is empty`);
    else if (lv.values?.length && !lv.values.includes(v)) probs.push(`position ${i+1} (${lv.name}): '${v}' not on the list`);
    else if (lv.pattern && !new RegExp("^(?:" + lv.pattern + ")$").test(v)) probs.push(`position ${i+1} (${lv.name}): '${v}' does not match pattern`); });
  return {ok: !probs.length, problems: probs};
}
function taxKey(spec, name) { if (!taxCheck(spec, name).ok) return null; const parts = name.split(spec.delimiter); const k = parts.filter((_, i) => spec.levels[i].key); return k.length ? k.join(spec.delimiter) : name; }
function taxGenerate(spec, values) { const probs = []; const parts = spec.levels.map(lv => { let v = String(values[lv.name] || "").trim(); if (!v) { if (lv.required !== false) probs.push(lv.name + " is required"); v = PH; } if (v.includes(spec.delimiter)) probs.push(lv.name + " contains the delimiter"); if (lv.values?.length && v !== PH && !lv.values.includes(v)) probs.push(`${lv.name}: '${v}' not on the list`); if (lv.pattern && !new RegExp("^(?:" + lv.pattern + ")$").test(v)) probs.push(`${lv.name}: '${v}' does not match pattern`); return v; }); return {name: parts.join(spec.delimiter), ok: !probs.length, problems: probs}; }

// --- hub fields (mapper targets)
const FIELDS = []; const addF = (group, kind, names, additive=true, unit="count") => names.forEach(n => FIELDS.push({id: n.toLowerCase().replace(/[^a-z0-9]+/g, "_"), group, kind, name: n, additive: kind === "measurement" ? additive : null, unit}));
addF("Campaign","dimension",["Campaign name","Campaign key","Client","Brand"]); addF("Media buy","dimension",["Media buy name","Media buy key","Placement ID","Site / publisher","Buy type","Cost type"]);
addF("Creative","dimension",["Creative name","Ad name","Size","Format"]); addF("Date & geography","dimension",["Day","Week","Market","Country"]); addF("Tracking","dimension",["GSID","Tracking ID","Click URL","Floodlight activity"]);
addF("Delivery","measurement",["Impressions","Clicks","Viewable impressions","Measurable impressions"]); addF("Cost","measurement",["Media cost","Fees"],true,"currency"); addF("Engagement & video","measurement",["Engagements","Video starts","Video completions"]);
addF("Conversions","measurement",["Conversions"]); addF("Reach","measurement",["Reach","Frequency"],false,"persons");
const FBY = Object.fromEntries(FIELDS.map(f => [f.id, f]));
function validateSpec(spec, header, recs, tax) {
  const out = []; const E = (n, m, fix) => out.push({rule: n, name: n, level: "error", message: m, rows: [], count: 0, fix, source: "Hub rule"}); const W = (n, m, fix) => out.push({rule: n, name: n, level: "warning", message: m, rows: [], count: 0, fix, source: "Hub rule"});
  const pairs = spec.pairs.filter(p => p.target); const targets = pairs.map(p => p.target);
  if (!targets.includes("day") && !targets.includes("week")) E("No date mapped", "map a Day or Week dimension", "pair the date column with Day");
  if (!targets.some(t => ["Delivery","Cost"].includes(FBY[t]?.group))) E("No cost or delivery measurement mapped", "map at least Impressions, Clicks or Media cost", "pair a delivery or cost column");
  if (!targets.some(t => ["media_buy_name","placement_id","media_buy_key"].includes(t))) E("Required key missing", "map Media buy name, Media buy key or Placement ID", "pair the placement column");
  const seen = {}; for (const p of pairs) { const f = FBY[p.target]; if (!f) { E("Unknown target", p.target, "choose a platform field"); continue; }
    if (seen[p.target] && f.kind === "dimension") E("Two source fields mapped to one single-value target", `${seen[p.target]} and ${p.source} → ${f.name}`, "remove one pair"); seen[p.target] = p.source;
    if (f.kind === "measurement") { const vals = recs.slice(0, 200).map(r => r[p.source]).filter(v => v !== "" && v != null); if (vals.length && vals.some(v => !isNum(v))) E("Measurement mapped to a text column", `${p.source} has non-numeric values`, "retype the column or choose another"); }
    if (f.group === "Conversions" && !p.window) E("Conversions without an attribution window", `${p.source} → Conversions`, "state the window, e.g. 7d_click"); }
  header.forEach(h => { if (!spec.pairs.some(p => p.source === h)) W("Source field left unmapped", `'${h}' is neither paired nor marked ignored`, "pair it or mark ignored"); });
  const src = Object.fromEntries(pairs.map(p => [p.target, p.source])); const suite = [];
  if (src.impressions) suite.push({id:"neg", name:"No negatives", kind:"no_negatives", level:"error", params:{columns:["impressions","clicks","media_cost"].filter(t => src[t]).map(t => src[t])}, source:"Hub rule"});
  if (src.clicks && src.impressions) suite.push({id:"clk", name:"Clicks ≤ impressions", kind:"lte", level:"error", params:{a:src.clicks, b:src.impressions}, source:"Hub rule"});
  if (src.reach && src.impressions) suite.push({id:"reach", name:"Reach ≤ impressions", kind:"lte", level:"error", params:{a:src.reach, b:src.impressions}, source:"Hub rule"});
  if (src.media_buy_name && tax) suite.push({id:"tax", name:"Naming convention", kind:"taxonomy", level:"warning", params:{col:src.media_buy_name}, fix:"open the taxonomy check", source:"Client taxonomy"});
  return out.concat(runRules(recs, suite, {taxonomy: tax}));
}

// --- time zones (DST-safe via Intl)
function tzOffsetMin(utcMs, tz) { const p = new Intl.DateTimeFormat("en-US", {timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}).formatToParts(new Date(utcMs)); const g = t => +p.find(x => x.type === t).value; return (Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute"), g("second")) - utcMs) / 60000; }
function localToUTC(dateStr, hhmm, tz) { const [y, m, d] = dateStr.split("-").map(Number); const [hh, mm] = hhmm.split(":").map(Number); let guess = Date.UTC(y, m - 1, d, hh, mm); for (let i = 0; i < 2; i++) guess = Date.UTC(y, m - 1, d, hh, mm) - tzOffsetMin(guess, tz) * 60000; return new Date(guess).toISOString(); }
function utcToLocal(iso, tz) { const p = new Intl.DateTimeFormat("en-GB", {timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"}).formatToParts(new Date(iso)); const g = t => p.find(x => x.type === t).value; return `${g("year")}-${g("month")}-${g("day")}T${g("hour")}:${g("minute")}`; }
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = s => (new Date(s + "T00:00:00Z").getUTCDay() + 6) % 7; // 0 = Monday
const isBday = s => dow(s) < 5; const priorBday = s => { while (!isBday(s)) s = addDays(s, -1); return s; };
function nthBday(y, m, n) { let s = `${y}-${String(m).padStart(2,"0")}-01`, k = 0; for (;;) { if (isBday(s)) k++; if (k === n) return s; s = addDays(s, 1); } }
function cycles(rule, start, end) { const out = []; if (rule.cadence === "weekly") { let s = addDays(start, -((dow(start) - (rule.weekday || 0) + 7) % 7)); for (; s <= end; s = addDays(s, 7)) if (s >= start) out.push({cycle: "W" + s, date: s}); }
  else { let [y, m] = start.split("-").map(Number); while (`${y}-${String(m).padStart(2,"0")}-01` <= end) { let d = rule.business_day ? nthBday(y, m, rule.business_day) : priorBday(`${y}-${String(m).padStart(2,"0")}-${String(Math.min(rule.day_of_month || 1, 28)).padStart(2,"0")}`); if (d >= start && d <= end) out.push({cycle: `${y}-${String(m).padStart(2,"0")}`, date: d}); if (++m > 12) { m = 1; y++; } } } return out; }
function instances(rule, start, end) { return cycles(rule, start, end).flatMap(({cycle, date}) => { const o = addDays(date, -(rule.outreach_days_before ?? 2)); return [
  {kind:"outreach", cycle, title:`${rule.name} · collect inputs (${(rule.inputs||[]).join(", ")})`, due_at: localToUTC(o, "09:00", rule.timezone), effort: 1},
  {kind:"qa", cycle, title:`${rule.name} · QA`, due_at: localToUTC(date, "09:00", rule.timezone), effort: rule.effort || 2},
  {kind:"send", cycle, title:`${rule.name} · send to client`, due_at: localToUTC(date, rule.send_time || "09:00", rule.timezone), effort: 1, blocked_by_kind: "qa"}]; }); }

// --- reach
const EPOCHS = [{platform:"cm360", report_type:"any", effective_date:"2026-01-13", description:"CM360 changed the Unique Reach method, incl. duplicate, exclusive and overlap metrics; re-run earlier reports may differ.", source_url:"https://support.google.com/campaignmanager/answer/12491035"},
  {platform:"cm360", report_type:"overlap", effective_date:"2025-07-08", description:"Overlap computed over the filtered entities only.", source_url:"https://support.google.com/campaignmanager/answer/16320235"}];
const findH = (hs, ...needles) => hs.find(h => needles.every(n => h.toLowerCase().includes(n)));
function parseReach(header, recs) {
  if (findH(header, "site a") && findH(header, "overlap")) { const a = findH(header, "site a"), b = findH(header, "site b"), o = findH(header, "overlap"); return {shape: "pairwise", pairs: recs.filter(r => r[a] && r[b]).map(r => ({a: r[a], b: r[b], overlap: num(r[o])}))}; }
  const site = findH(header, "site"), reach = findH(header, "total reach"), excl = findH(header, "exclusive"), dup = findH(header, "duplicate");
  if (!site || !reach || !excl) throw new Error("not a recognised CM360 reach export; headers: " + header.join(", "));
  const sites = []; let total = null; for (const r of recs) { const n = String(r[site]).trim(); if (!n) continue; const rv = num(r[reach]), ev = num(r[excl]), dv = dup ? num(r[dup]) : null; if (n.toLowerCase() === "total") { total = rv; continue; } const derived = rv - ev; sites.push({site: n, reach: rv, exclusive: ev, duplicate: dv ?? derived, duplicate_derived: dv == null, matches_google: dv == null || Math.abs(dv - derived) <= 1}); }
  return {shape: "per_site", sites, campaign_reach: total};
}
function reachMeasures(p) { if (p.shape !== "per_site") return {formula: "dedup-v1", pairs: p.pairs.length}; const sum = p.sites.reduce((a, s) => a + s.reach, 0); const R = p.campaign_reach; return {formula: "dedup-v1", sum_site_reach: sum, campaign_reach: R, dedup_rate: R && sum ? 1 - R / sum : null, duplicate_share: Object.fromEntries(p.sites.map(s => [s.site, s.reach ? s.duplicate / s.reach : null])), note: R == null ? "No 'Total' row: campaign reach absent, so dedup rate is not computed (site reach is never summed)." : ""}; }
function reachChecks(sch, ws, we, filt, dims, pull) { const out = []; let inc = true, why = null, val = "reportable"; const days = Math.round((new Date(we) - new Date(ws)) / 86400000) + 1;
  out.push({check: "Window within CM360's reach limit", ok: days <= 93, detail: `${days} days (limit 93)`, source: "https://support.google.com/campaignmanager/answer/2823516"}); if (days > 93) { val = "not reportable"; inc = false; why = `window is ${days} days; CM360 cannot report reach beyond 93 days in one report`; }
  if (sch) { const keys = new Set([...Object.keys(sch.filter_signature || {}), ...Object.keys(filt || {})]); const diff = [...keys].filter(k => JSON.stringify(sch.filter_signature?.[k]) !== JSON.stringify(filt?.[k])); const det = diff.map(k => `${k}: schedule ${JSON.stringify(sch.filter_signature?.[k])}, pull ${JSON.stringify(filt?.[k])}`).join("; ");
    out.push({check: "Filter set matches the pull schedule", ok: !diff.length, detail: diff.length ? det : "matches", source: "Hub rule: a series is comparable only with identical filters"}); if (diff.length && inc) { inc = false; why = "filters differ from the schedule — " + det; }
    const dd = JSON.stringify([...(dims||[])].sort()) !== JSON.stringify([...(sch.dimensions||[])].sort()); out.push({check: "Dimensions match the schedule", ok: !dd, detail: `schedule ${JSON.stringify(sch.dimensions)}, pull ${JSON.stringify(dims)}`, source: "Hub rule"}); if (dd && inc) { inc = false; why = "dimensions differ from the schedule"; } }
  const cross = EPOCHS.filter(e => ws < e.effective_date && e.effective_date <= we); out.push({check: "No platform method change inside the window", ok: !cross.length, detail: cross.map(e => `${e.effective_date}: ${e.description}`).join("; ") || "none", source: cross[0]?.source_url || "method_epoch"}); if (cross.length && val === "reportable") val = "directional";
  const fresh = Math.round((new Date(pull) - new Date(we)) / 86400000); out.push({check: "Pulled after the platform's reach stabilised (~3 days)", ok: fresh >= 3, detail: `pulled ${fresh} day(s) after window end`, source: "https://support.google.com/displayvideo/answer/6170584"}); if (fresh < 3 && val === "reportable") val = "provisional";
  return {checks: out, included: inc, reason: why, validity: val}; }

// ===== store (db capability) + state =====
const COLS = ["clients","campaigns","publishers","users","taxonomies","uploads","templates","plans","facts","rules","tasks","schedules","snapshots","audit","placements"];
const S = Object.fromEntries(COLS.map(c => [c, []])); let DB = null, USER = null, READONLY = false;
const byId = (col, id) => S[col].find(x => x.id === id);
async function loadAll() { if (!DB) return; await Promise.all(COLS.map(async c => { try { const q = await DB.collection(c).get(); S[c] = q.docs.map(d => ({id: d.id, ...d.data()})); } catch (e) { console.warn(c, e); } })); }
async function put(col, obj, action="create", before=null) { obj.id = obj.id || uid(); obj.updated_at = new Date().toISOString(); obj.created_at = obj.created_at || obj.updated_at;
  const i = S[col].findIndex(x => x.id === obj.id); if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  if (DB) { try { await DB.doc(`${col}/${obj.id}`).set(strip(obj)); const a = {id: uid(), ts: obj.updated_at, action, entity: col, entity_id: obj.id, before: before ? strip(before) : null, after: strip(obj)}; S.audit.push(a); await DB.doc(`audit/${a.id}`).set(strip(a)); } catch (e) { if (e?.code === "invalid_argument") READONLY = true; toast("Save failed: " + (e.message || e.code || e)); } }
  return obj; }
async function trash(col, id) { const o = byId(col, id); if (!o) return; const before = {...o}; o.deleted_at = new Date().toISOString(); await put(col, o, "delete", before); }
const strip = o => JSON.parse(JSON.stringify(o, (k, v) => v === undefined ? null : v));
const live = col => S[col].filter(x => !x.deleted_at);

// --- identity: platform id → taxonomy key → exact name → fuzzy (suggest only)
function similarity(a, b) { const la = a.length, lb = b.length; if (!la || !lb) return 0; const d = Array.from({length: la + 1}, (_, i) => [i, ...Array(lb).fill(0)]); for (let j = 1; j <= lb; j++) d[0][j] = j; for (let i = 1; i <= la; i++) for (let j = 1; j <= lb; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return 1 - d[la][lb] / Math.max(la, lb); }
async function resolvePlacement(campaign_id, name, platform_id, tkey, seen) { const pls = live("placements").filter(p => p.campaign_id === campaign_id); let pl = null, how = null;
  if (platform_id) { pl = pls.find(p => (p.platform_ids || []).includes(String(platform_id))); if (pl) how = "platform id"; }
  if (!pl && tkey) { pl = pls.find(p => p.taxonomy_key === tkey); if (pl) how = "taxonomy key"; }
  if (!pl) { pl = pls.find(p => (p.aliases || []).some(a => a.name === name)); if (pl) how = "exact name"; }
  let suggestion = null; if (!pl) { let best = null; for (const p of pls) for (const a of p.aliases || []) { const s = similarity(name, a.name); if (s >= 0.85 && (!best || s > best.s)) best = {s, name: a.name, placement_id: p.id}; } suggestion = best; pl = {id: uid(), campaign_id, placement_key: `P-${name.slice(0, 40)}`, taxonomy_key: tkey, aliases: [], platform_ids: [], first_seen: seen, last_seen: seen}; how = "new"; }
  const before = {...pl}; pl.last_seen = pl.last_seen > seen ? pl.last_seen : seen; if (!pl.aliases.some(a => a.name === name)) pl.aliases.push({name, first_seen: seen, last_seen: seen}); if (platform_id && !pl.platform_ids.includes(String(platform_id))) pl.platform_ids.push(String(platform_id)); if (tkey && !pl.taxonomy_key) pl.taxonomy_key = tkey;
  await put("placements", pl, how === "new" ? "create" : "update", how === "new" ? null : before); return {placement_id: pl.id, matched_by: how, suggestion}; }

// --- explorer over facts (non-additive guard)
function explore(campaign_id, group_by) { const rows = live("facts").filter(f => f.campaign_id === campaign_id).flatMap(f => f.records.map(r => ({...r, upload_id: f.upload_id}))); if (!rows.length) return {rows: [], refusals: []};
  const bucket = r => group_by === "day" ? r.date : group_by === "week" ? addDays(r.date, -dow(r.date)) : group_by === "month" ? r.date.slice(0, 7) : group_by === "placement" ? (r.placement || "(unmatched)") : "total";
  const g = {}; for (const r of rows) { const k = bucket(r) + "\x1f" + r.metric; (g[k] ||= {bucket: bucket(r), metric: r.metric, additive: r.additive, total: 0, n: 0, dates: new Set(), placements: new Set()}); const x = g[k]; x.total += r.value; x.n++; x.dates.add(r.date); x.placements.add(r.placement); }
  const out = [], refusals = []; for (const x of Object.values(g).sort((a, b) => a.bucket.localeCompare(b.bucket) || a.metric.localeCompare(b.metric))) { if (x.additive === false && x.n > 1) { refusals.push({bucket: x.bucket, metric: x.metric, reason: `${x.metric} is non-additive: ${x.n} measured values (${x.dates.size} day(s), ${x.placements.size} placement(s)) cannot be summed into one figure. Show them side by side, or use a deduplicated reach report for this window.`, source: "metric additive flag"}); out.push({bucket: x.bucket, metric: x.metric, value: null, refused: true}); } else out.push({bucket: x.bucket, metric: x.metric, value: x.total, refused: false, n: x.n}); }
  return {rows: out, refusals}; }

// --- pivot (client-side, sums/counts; ratios recomputed; reach guarded)
function pivot(rows, rowsBy, colsBy, values) { const key = (r, fs) => fs.map(f => r[f] ?? "").join(" · ") || "Total"; const cells = {}, rk = new Set(), ck = new Set();

studio: {what: "Client-styled deliverables composed from the record; they recompute when the data changes.", items: ["New deliverable: pick a plan and a title. Choose blocks — headline plan of record, change report, provenance summary, line register, sensitivity, reconciliation pacing, latest CM360 overlap read, audience basis, open actions, fallback resolutions. Set the client style: primary and accent colours, font, masthead.", "The deliverable is a spec, not a copy: every open re-reads the register, forecast, actuals and interpretations. Flags travel with it — BACK-SOLVED, unverified defaults, missing provenance, policy blocks.", "Snapshot writes a dated copy to Reports. Export as .html or .xlsx (cover, headline, register, resolutions, change report, reconciliation).", "Calculation studio (define → bind → validate → run → explain) and request templates."]},
datorama: {what: "Turn the media plan into a Datorama workspace plan: registries, taxonomy, trafficking sheet, classifications, compliance, diagnostics, runbook.", items: ["The one idea: a placement name carries a stable ID plus only flight-invariant attributes (client, market scope, ran in, publisher, channel, funnel). Package, LOB, cost method, size/format and audience are volatile — they never enter a name; they live in classifications keyed on the ID. Every stranded dollar in the reference workspace traced to a volatile attribute in an immutable string.", "Questions: anything the client profile cannot resolve (unknown publisher, new buy model, PKG/AV cost, ambiguous flight, hybrid CPM/CPC, several audiences on one budget, new channel, no authoritative stream) is one plain-language card. Each answer writes to a registry so it is never asked twice. The badge on the tab is the open count.", "Plan lines: the normalised §2.2 schema for the selected plan. Mint / carry IDs uses the plan's own Status column (New → mint, Updated/Revised → carry forward, blank → unchanged); a line that cannot be matched with confidence is a question, never a new ID. Benchmarks stated inline on the plan are harvested at ingestion.", "Taxonomy: one template per data level, recommended by default; a token-position editor with the question each token answers, vocabulary, required and volatile flags, and a live preview against CM360's 255-character limit. Rules: volatile attributes blocked unless overridden with a typed reason; the stable ID in every template; constant token count per level; no delimiter inside a token; never a token called Region — Ran In · Funded By · Agency Book · Market Scope.", "Generate: the DCM-shaped trafficking sheet, the classification set (one sheet per volatile attribute, keyed on the ID), the dimension manifest (~20 thin dimensions, one per question) and the measure manifest (Platform / Plan / Actualized Spend with fixed jobs; Rate Card · Negotiated · Effective · Savings; channel-conditional metrics suppressed, never zero).", "Compliance: ten checks on the generated sheet, pasted names or an uploaded export, reported as % of lines and % of SPEND compliant — ≥95% of spend to proceed, below it dimensions are running on fallbacks.", "Streams: one row per data stream with grain, join key, cost and units fields, finalization window, cadence and ingest route. Exactly one authoritative stream per metric — two is rejected and named. The longest finalization window sets the forecast lookback floor (CM360: 7 days). Publisher registry: plan grain vs delivery grain → join grain, the coarser.", "Forecast: ingest a CM360 or partner export against a declared stream; run-rate over a lookback that defaults to the longest finalization window (warns below it and names the stream), capped at plan; pacing against the 80–110% band; the three spend metrics per month with Close month freezing Actualized Spend. Freshness per stream: max(Day) older than its cadence turns the Streams button red.", "Benchmarks: upload a pivot whose rows carry channel, publisher, audience and format; proposals are matched to the benchmark key, shown against what is on file, and written only on confirm — superseded rows keep their as_of. Performance vs benchmark reads delivered CTR against the range stated on the plan.", "Stream files: an upload-ready .xlsx per stream to its exact header contract (data on the first sheet), a stable email-in subject line, and the flowchart → plan feed converter keyed on month position.", "Diagnostics: the seven-step ladder on any uploaded pivot — total = body, metric non-zero anywhere, one stream carrying all, fallback share (NULL ≠ ''), plan vs delivery zero side, filters, drift vs the previous pull.", "Runbook: 19 steps before / during / after flight; steps the Hub can verify are marked automatically, the rest tick by hand. Thresholds show their basis and sample size (one reference workspace) — re-calibrate per client after a flight.", "Datorama's own documentation is the authority for platform behaviour and changes without notice; verify pattern parsing, classification matching and TotalConnect contracts against the current Salesforce Marketing Cloud Intelligence docs and record the date checked."]},
admin: {what: "The catalogue everything else refers to.", items: ["Add clients, campaigns (each belongs to a client), publishers and users. Users need a named time zone — it drives task times and the team week.", "Trash removes a row but keeps it; the audit log below records every create, update, delete and restore with a timestamp.", "Set these up first: uploads need a client and campaign, report rules need an owner."]},
"campaigns:inbox": {what: "Drop files here. Nothing is committed until you map it.", items: ["Choose the client and campaign first, then drop or choose CSV or Excel files. Each file is hashed; identical bytes are recognised, not stored twice.", "The header set is matched against saved mapping templates: 'recognised' means a template exists, 'needs mapping' means open it in Map.", "Files over about 220 KB are refused (the store's document limit) — split or aggregate them first.", "Open a file to work on it in Map or File QA."]},
"campaigns:map": {what: "Turn a report into facts, in three steps.", items: ["1 · Preview and transform: add steps to skip title rows, promote the header row, drop empty or 'Total' rows. Set the date format the file uses.", "2 · Pair the fields: for each source column choose the Hub field on the right (dimensions and measurements grouped like Datorama), mark unused columns ignored, and give Conversions an attribution window. Reach fields are flagged non-additive.", "3 · Validate: errors (no date, no key, text in a measurement, clicks above impressions…) block saving; warnings need acknowledging.", "Save template stores the mapping as a version; the next file with the same columns is recognised automatically. Commit facts writes the rows, resolving each placement by platform ID → taxonomy key → exact name → fuzzy (suggestion only)."]},
"campaigns:qa": {what: "Check a file before anyone uses it.", items: ["Run QA applies the starter suite: required columns, no negatives, clicks ≤ impressions, viewable ≤ impressions, reach ≤ impressions, duplicate rows, CTR reconciles, names pass the client's taxonomy.", "Result: Pass, Pass with warnings, or Fail, with the failing rows and a suggested fix for each rule, and the source of each threshold.", "Nothing is committed here — it is a check only."]},
"campaigns:plans": {what: "Media plan versions and what changed between them.", items: ["Choose the campaign and an uploaded plan file, pair the plan fields (placement name is required; rate, units, cost, flights and so on as available) and commit. Every commit is a new immutable version.", "Compare any two versions: added and removed placements, and every field that changed, e.g. rate 18 → 16.", "Flight start and end dates from the latest version appear on the Calendar."]},
"campaigns:explore": {what: "Aggregate committed facts the way the platforms allow.", items: ["Pick a campaign and a grain: day, week, month, placement or total. Additive metrics (impressions, clicks, cost) sum.", "Reach is refused wherever a sum would combine more than one measured value; the refusal explains why. At week grain a single measured value per week is shown as is.", "Export CSV downloads the grid plus the refusals and their reasons."]},
"campaigns:reach": {what: "Deduplicated reach over time, from CM360 pulls.", items: ["Save a schedule: report type (unique reach or overlap), window (7-day, monthly, 90-day), the exact filters as JSON, and dimensions. Every pull in a series must match it.", "Register a pull: pick the uploaded CM360 export (per-site with a 'Total' row, or pairwise overlap), the window dates, the pull date and the filters used. The Hub checks: window ≤ 93 days, filters and dimensions match the schedule, no method change inside the window, pulled ≥ 3 days after the window.", "Failing pulls are stored but excluded, with the reason naming the exact difference; you can include or exclude any pull.", "The chart is dedup rate = 1 − campaign reach ÷ Σ site reach. Orange markers show CM360's method changes (13 Jan 2026, 8 Jul 2025); points across a marker are not comparable."]}};
function helpPanel(key) { const h = HELP[key]; if (!h) return ""; const open = localStorage.getItem("help:" + key) !== "closed"; return `<details class="help" data-help="${key}" ${open ? "open" : ""}><summary>How to use this tab <span class="lab">— ${esc(h.what)}</span></summary><ul>${h.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>`; }
document.addEventListener("toggle", e => { const d = e.target; if (d.matches?.("details[data-help]")) localStorage.setItem("help:" + d.dataset.help, d.open ? "open" : "closed"); }, true);

  $("#main").innerHTML = (P[r] || (() => pEmpty("Not found", "")))() + ""; const m = $("#main"); const first = m.querySelector(".topbar, h1"); if (first && !["campaigns","plans","reports","audiences","library","clients","studio","datorama"].includes(r)) first.insertAdjacentHTML("afterend", helpPanel(r)); if (READONLY) $("#ro").style.display = "block"; }

// ---- Taxonomy
function pTaxonomy() { const tx = V.tax || (V.tax = {client_id: "", name: "Placement names", delimiter: "_", levels: [{name:"Campaign", pattern:"CMP\\d{2}[A-Z]+", key:true},{name:"Publisher", values:["PUBA","PUBB","PUBC"]},{name:"Channel", values:["NEWS","DISP","VID","SOC"]},{name:"Code", pattern:"P\\d{4}", key:true}]});
  const preview = tx.levels.map(l => l.values?.[0] || (l.pattern ? `<${l.name}>` : l.name)).join(tx.delimiter);
  return `<div class="topbar"><h1>Taxonomy</h1></div><div class="grid"><div class="card s6"><b>Builder</b><div class="lab">Fixed positions · one delimiter · NA for empty · key positions identify a placement across renames</div>

  <table><thead><tr><th>#</th><th>Level</th><th>Allowed values (comma) or pattern</th><th>Key</th><th></th></tr></thead><tbody>${tx.levels.map((l, i) => `<tr><td>${i + 1}</td><td><input ${inp} data-lv="${i}" data-f="name" value="${esc(l.name)}"></td><td><input ${inp} style="width:100%" data-lv="${i}" data-f="vals" value="${esc(l.values ? l.values.join(",") : l.pattern || "")}"></td><td><input type="checkbox" data-lv="${i}" data-f="key" ${l.key ? "checked" : ""}></td><td><button class="btn ghost sm" data-a="tx_del" data-v="${i}">×</button></td></tr>`).join("")}</tbody></table>
  <div class="frow"><button class="btn ghost" data-a="tx_add">+ Level</button><button class="btn" data-a="tx_save">Save version</button><span class="lab">Preview: <span class="mono">${esc(preview)}</span></span></div></div>
  <div class="card s6"><b>Compliance check</b><div class="lab">Paste placement names from a Prisma, Spectra or CM360 export — one per line</div><textarea id="tx_names" class="inp mono" rows="6" style="width:100%">${esc(V.taxNames ?? "CMP26BRD_PUBA_NEWS_P0009\nCMP26BRD_PUBX_NEWS_P0010\nCMP26BRD_PUBB_DISP")}</textarea>
  <div class="frow">${live("taxonomies").map(t => `<button class="btn ghost" data-a="tx_check" data-v="${t.id}">Check against ${esc(t.name)} v${t.version}</button>`).join("") || `<span class="lab">Save a taxonomy first.</span>`}</div>
  ${V.taxRes ? `<div class="big" style="margin-top:8px">${V.taxRes.pct}% <span class="lab">${V.taxRes.passed} of ${V.taxRes.checked} pass · ${V.taxRes.fails.length} would fall to unclassified in Datorama</span></div>${V.taxRes.byPos.map(p => `<div class="bar"><span>${p.position}. ${esc(p.level)}</span><div class="track"><div class="fill ${p.pct >= 90 ? "" : "warn"}" style="width:${p.pct}%"></div></div><span>${p.pct}%</span></div>`).join("")}<table>${V.taxRes.fails.map(f => `<tr><td class="mono">${esc(f.name)}</td><td class="lab">${esc(f.problems.join("; "))}</td></tr>`).join("")}</table>` : ""}</div></div>`; }

// ---- Campaigns (inbox / map / qa / plans / explore / reach)
function pCampaigns() { const modes = [["inbox","Inbox"],["map","Map"],["qa","File QA"],["plans","Plans"],["explore","Explore"],["reach","Reach"]]; const ups = live("uploads").slice().reverse();
  const table = `<div class="card"><table><thead><tr><th>#</th><th>File</th><th>Client · campaign</th><th class="num">Rows</th><th>Headers</th><th>Route</th><th>Status</th><th></th></tr></thead><tbody>${ups.map((u, i) => `<tr class="${V.sel === u.id ? "sel" : ""}"><td>${ups.length - i}</td><td>${esc(u.filename)}</td><td class="lab">${esc(byId("clients", u.client_id)?.name || "—")} · ${esc(byId("campaigns", u.campaign_id)?.name || "—")}</td><td class="num">${u.rows ?? "—"}</td><td class="lab">${(u.headers || []).slice(0, 4).map(esc).join(" · ")}${u.headers?.length > 4 ? ` +${u.headers.length - 4}` : ""}</td><td>${pill(u.route, u.route === "mapped" ? "ok" : u.route === "quarantine" ? "bad" : "info")}</td><td>${esc(u.status)}</td><td><button class="btn ghost sm" data-a="open" data-v="${u.id}">Open</button></td></tr>`).join("") || `<tr><td colspan="8" class="lab">No uploads yet.</td></tr>`}</tbody></table></div>`;
  const drop = `<div class="empty drop" id="drop"><b>Drop publisher reports, plans or exports here</b>Each file is hashed, stored once, shape-detected and matched to a mapping template if one exists. <div class="frow" style="justify-content:center;margin-top:8px"><select id="up_client" ${inp}><option value="">Client…</option>${opt(live("clients"), V.upClient)}</select><select id="up_camp" ${inp}><option value="">Campaign…</option>${opt(live("campaigns").filter(c => !V.upClient || c.client_id === V.upClient), V.upCamp)}</select><input type="file" id="file" multiple hidden><button class="btn" data-a="pick">Choose files</button></div></div>`;

function pMap() { const u = byId("uploads", V.sel); if (!u) return `<div class="lab">Open an upload above to map it.</div>`; const pv = V.preview; const groups = [...new Set(FIELDS.map(f => f.group))];
  return `<div class="card"><div class="topbar"><b>Map: ${esc(u.filename)}</b><span class="lab">${pv?.records.length ?? "…"} rows</span><span class="spacer"></span><button class="btn ghost" data-a="validate">Validate</button><input id="tpl_name" ${inp} value="${esc(V.tplName || u.filename.replace(/[_\-]?\d{4}.*$/, ""))}"><button class="btn" data-a="save_tpl">Save template</button><button class="btn" data-a="commit">Commit facts</button></div>
  <div class="lab">1 · Preview and transform</div><div class="frow">${V.recipe.map(s => pill(s.op + (s.n ? " " + s.n : "") + (s.col ? " " + s.col : ""), "info")).join("")}<button class="btn ghost sm" data-a="step" data-v="skip">+ Skip 1 row</button><button class="btn ghost sm" data-a="step" data-v="promote">+ Promote header</button><button class="btn ghost sm" data-a="step" data-v="drop_empty">+ Drop empty</button><button class="btn ghost sm" data-a="step" data-v="drop_where">+ Drop where…</button><button class="btn ghost sm" data-a="step" data-v="reset">Reset</button><span class="lab">Date format <select id="datefmt" ${inp}>${["%Y-%m-%d","%d/%m/%Y","%m/%d/%Y"].map(f => `<option ${V.dateFmt === f ? "selected" : ""}>${f}</option>`).join("")}</select></span></div>
  ${pv ? `<div class="scroll"><table><thead><tr>${pv.header.map(h => `<th>${esc(h)}<div class="lab" style="font-weight:400">${pv.records.slice(0, 50).every(r => r[h] === "" || isNum(r[h])) ? "number" : "text"}</div></th>`).join("")}</tr></thead><tbody>${pv.records.slice(0, 5).map(r => `<tr>${pv.header.map(h => `<td class="mono">${esc(r[h])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
  <div class="lab">2 · Pair the fields — source on the left, Hub field on the right</div><div class="pairs"><div>${V.pairs.map(p => `<div class="src ${p.ignored ? "ign" : ""}"><span>${esc(p.source)}</span><span class="lab">${p.target ? "●" : p.ignored ? "×" : "○"}</span></div>`).join("")}</div>
  <div>${V.pairs.map(p => { const t = FBY[p.target]; return `<div class="tgt ${t?.group === "Reach" ? "reach" : ""}"><select ${inp} data-pair="${esc(p.source)}"><option value="">— unmapped —</option><option value="__ignore" ${p.ignored ? "selected" : ""}>— ignored —</option>${groups.map(g => `<optgroup label="${(FIELDS.find(f => f.group === g).kind === "dimension" ? "DIM · " : "MEAS · ") + g}">${FIELDS.filter(f => f.group === g).map(f => `<option value="${f.id}" ${p.target === f.id ? "selected" : ""}>${f.name}</option>`).join("")}</optgroup>`).join("")}</select>${t?.group === "Reach" ? pill("non-additive", "warn") : ""}${t?.group === "Conversions" ? `<input ${inp} placeholder="window e.g. 7d_click" data-win="${esc(p.source)}" value="${esc(p.window || "")}">` : ""}</div>`; }).join("")}</div></div>
  ${V.val ? `<div class="lab">3 · Validate</div><div class="topbar">${pill(V.val.status, stc(V.val.status))}<span class="lab">errors block saving; warnings need acknowledgement</span></div>${findings(V.val.findings)}` : ""}</div>`; }
function pQA() { const u = byId("uploads", V.sel); if (!u) return `<div class="lab">Open an upload above to run File QA.</div>`; const r = V.qa;
  return `<div class="card"><div class="topbar"><b>File QA: ${esc(u.filename)}</b><span class="lab">compliance + logic tests · nothing committed</span><span class="spacer"></span><button class="btn" data-a="run_qa">Run QA</button></div>${r ? `<div class="topbar">${pill(r.status, stc(r.status))}<span class="lab">Starter delivery suite · ${r.rows} rows · ${r.flagged} flagged rows</span></div>${findings(r.findings)}` : ""}</div>`; }

  live("reports").filter(r => inScope(r) && r.kind === "interpretation").forEach(r => { r.body.findings?.forEach(f => add("CM360 interpretation", `${r.name} [${f.status}]: ${f.text}`, r.name)); (r.body.sites || []).filter(s => !s.dash).forEach(s => add("CM360 site", `${r.name}: ${cleanName(s.site)} exclusive ${fmt(s.exclusive)}, duplicate ${fmt(s.duplicate)}, total ${fmt(s.total_ed)}, exclusive share ${(s.excl_share * 100).toFixed(1)}%, duplicate rate ${(s.dup_rate * 100).toFixed(1)}%, box ${s.box}`, r.name)); });
  live("forecasts").filter(inScope).forEach(f => add("forecast", `${f.name} (${f.created_at.slice(0, 10)}): divisor ${f.divisor}, universe ${fmt(f.universe)}, publishers ${f.include.join(", ")}; combined cumulative reach ${fmt(Math.round(f.results.markets.Combined.cumulative.at(-1)))} = ${(f.results.markets.Combined.share.at(-1) * 100).toFixed(1)}% of universe, flight frequency ${f.results.markets.Combined.flight_freq.toFixed(1)}x`, f.name));
  live("closeouts").filter(inScope).forEach(c => add("closeout", `${byId("campaigns", c.campaign_id)?.name}: ${c.summary}; divisor floor ${c.divisor_floor}, measured ${c.divisor_measured ?? "n/a"}; outcome ${c.forecast || "n/a"}`, "closeout"));
  live("documents").filter(inScope).forEach(d => { const paras = d.text.split(/\n\s*\n/).map(p => p.replace(/\s+/g, " ").trim()).filter(p => p.length > 40); paras.forEach(p => add(d.kind.replace(/_/g, " "), (d.partner ? d.partner + " — " : "") + p.slice(0, 600), d.title)); });
  const METHOD = ["Reach is non-additive: never sum reach across sites, periods or reports. Duplicate reach = Reach − Exclusive reach (Google). Duplicate rate = Duplicate ÷ Total Reach, never Duplicate ÷ (Duplicate + Total).", "Dedup order of operations: gross line reach = impressions × on-target rate ÷ frequency ÷ device ratio → partner ceiling against its pool → channel roll-up → sum of channels ÷ deduplication divisor (1.40 pre-flight floor, or measured = Σ partner reach ÷ DCM deduplicated pull) → months unioned against the universe with C = C0 + R × (1 − C0/U) (Sainsbury). Weeks cannot be unioned into a month.", "The divisor applies only to lines in the DCM pull; publisher-reported (newsletters), platform-reported (LinkedIn) and modelled (Condé Nast) buckets union on top.", "CM360 reach windows max 93 days; blocks cannot be added; method changed 13 Jan 2026; reach stabilises ~3 days after window end."]; METHOD.forEach(m => add("method", m, "Hub method notes"));

function askBox(scope, cid) { return `<div class="ask"><b>Ask the Hub</b><div class="lab">Answers only from what is stored for ${cid ? esc(byId("clients", cid)?.name || "this client") : "all clients"} — publisher answers, rates and their provenance, reach definitions, universe sources, interpretations, forecasts, closeouts. Each answer lists the facts it used.</div><div class="frow"><input id="ask_q_${scope}" ${inp} style="flex:1" placeholder="e.g. How did we derive WSJ's 9% on-target rate? Which partners can't report reach?"><button class="btn" data-a="ask" data-v="${scope}|${cid}">Ask</button></div><div id="ask_out_${scope}" style="font-size:13px;white-space:pre-wrap"></div></div>`; }
async function askHub(scope, cid, q) { const out = $("#ask_out_" + scope); if (!q.trim()) return; const facts = factsFor(scope, cid); const words = q.toLowerCase().split(/\W+/).filter(w => w.length > 3); const score = f => words.reduce((a, w) => a + (f.text.toLowerCase().includes(w) ? 1 : 0), 0); const picked = facts.map(f => ({f, s: score(f)})).sort((a, b) => b.s - a.s).slice(0, 60).map(x => x.f).concat(facts.filter(f => f.kind === "method")); const seen = new Set(); const ctx = picked.filter(f => !seen.has(f.text) && seen.add(f.text)).map((f, i) => `[${i + 1}] (${f.kind}; source: ${f.src}) ${f.text}`).join("\n");

function planChangeReport(A, B) { const key = l => `${cleanName(l.partner)}|${norm(l.placement).replace(/[^a-z0-9 ]/g, "")}|${/san fran|sf|bay/i.test(l.market) ? "SF" : /event/i.test(l.market) ? "Event" : "Nat"}`; const grp = P => { const g = {}; P.lines.forEach(l => { (g[key(l)] ||= {partner: cleanName(l.partner), placement: l.placement, market: l.market, n: 0, imps: 0, cost: 0, flights: [], audiences: new Set()}); const x = g[key(l)]; x.n++; x.imps += l.impressions || 0; x.cost += l.cost || 0; x.flights.push(l.flight); if (l.audience) x.audiences.add(l.audience.trim()); }); return g; }; const a = grp(A), b = grp(B); const ev = [];

const TIER = {PUB: "T1", "3P": "T3", CALC: "T4", OURS: "T5", NONE: null}; const TIER_LABEL = {T1: "partner-stated for this plan", T2: "measured on our own delivery", T3: "third-party or benchmark", T4: "derived by equation", T5: "assigned by us"};
